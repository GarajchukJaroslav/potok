<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Поток</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="flow" id="flow">

  <!-- ЭКРАН 1: ЦЕЛИ -->
  <section class="screen" data-view="goals">
    <div class="screen-inner">
      <div class="page-title no-back">
        🎯 Цели
      </div>
      <div class="goals-bar">
        <input id="goalInput" placeholder="Новая цель..." maxlength="200">
        <input type="date" id="goalDeadline" class="date-input" title="Дедлайн цели">
        <button class="btn-add" onclick="addGoal()">+</button>
      </div>
      <div class="list" id="goalList"></div>
    </div>
    <button class="nav-btn nav-down" onclick="goDown()" title="Дальше">↓</button>
  </section>

  <!-- ЭКРАН 2: РУТИНА / ЗОЖ -->
  <section class="screen" data-view="routine">
    <div class="screen-inner">
      <div class="page-title">
        💪 Рутина / ЗОЖ
      </div>
      <div class="cols cols-routine">
        <div class="card">
          <div class="card-head">
            <div class="card-icon p1">🎯</div>
            <div style="flex:1">
              <div class="card-title">Привычки</div>
              <div class="card-sub" id="habitSub"></div>
            </div>
          </div>
          <div class="input-row">
            <input id="habitInput" placeholder="Новая привычка..." maxlength="80">
            <button class="btn-add" onclick="addHabit()">+</button>
          </div>
          <div class="presets" id="presets">
            <button class="preset active" data-target="1" data-period="day">ежедневно</button>
            <button class="preset" data-target="2" data-period="day">2× в день</button>
            <button class="preset" data-target="3" data-period="day">3× в день</button>
            <button class="preset" data-target="3" data-period="week">3× в неделю</button>
            <button class="preset" data-target="5" data-period="week">5× в неделю</button>
          </div>
          <div class="list" id="habitList"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-icon p2">📋</div>
            <div>
              <div class="card-title">Канбан</div>
            </div>
          </div>
          <div class="kanban" id="kanban"></div>
        </div>
      </div>
    </div>
    <button class="nav-btn nav-up" onclick="goUp()" title="Назад">↑</button>
    <button class="nav-btn nav-down" onclick="goDown()" title="Дальше">↓</button>
  </section>

  <!-- ЭКРАН 3: ЧЕКЛИСТ -->
  <section class="screen" data-view="checklist">
    <div class="screen-inner">
      <div class="page-title">
        ✅ Чеклист
      </div>
      <div class="checklist-cols">
        <div class="checklist-main">
          <div class="checklist-section-title">События системы</div>
          <div class="list" id="checklistList"></div>
        </div>
        <div class="checklist-side">
          <div class="side-head">
            <select class="side-select" id="sideSelect" onchange="switchManualType(this.value)">
              <option value="want">Не хочу делать</option>
              <option value="result">Результат не соответствует</option>
            </select>
            <button class="manual-add-btn" id="sideAddBtn" onclick="openManualPicker()" title="Добавить">+</button>
          </div>
          <div class="list" id="checklistManualList"></div>
        </div>
      </div>
    </div>
    <button class="nav-btn nav-up" onclick="goUp()" title="Назад">↑</button>
    <button class="nav-btn nav-down" onclick="goDown()" title="Дальше">↓</button>
  </section>

  <!-- ЭКРАН 4: АНАЛИЗ -->
  <section class="screen" data-view="analysis">
    <div class="screen-inner">
      <div class="page-title">
        🔍 Анализ → Действия
      </div>
      <div id="analysisHome" class="analysis-home"></div>
      <div id="analysisFocus" class="analysis-focus" style="display:none;"></div>
    </div>
    <div id="mergePanelHost"></div>
    <button class="nav-btn nav-up" onclick="goUp()" title="Назад">↑</button>
  </section>

</div>

<!-- МОДАЛКА ИСТОРИИ ПРИВЫЧКИ -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this) closeHabitModal()">
  <div class="modal">
    <div class="modal-head">
      <div style="flex:1; min-width:0">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-sub" id="modalSub"></div>
      </div>
      <button class="modal-close" onclick="closeHabitModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-cal-col">
        <div class="month-nav">
          <button onclick="changeMonth(-1)">←</button>
          <div id="monthLabel"></div>
          <button onclick="changeMonth(1)">→</button>
        </div>
        <div class="calendar" id="calendar"></div>
      </div>
      <div class="modal-detail-col">
        <div class="day-detail" id="dayDetail"></div>
      </div>
    </div>
  </div>
</div>

<!-- МОДАЛКА РУЧНЫХ СОБЫТИЙ -->
<div class="manual-overlay" id="manualOverlay" onclick="if(event.target===this) closeManualPicker()">
  <div class="manual-modal">
    <div class="manual-modal-head">
      <div class="manual-modal-title" id="manualModalTitle">Не хочу делать</div>
      <button class="modal-close" onclick="closeManualPicker()">✕</button>
    </div>
    <div class="manual-field">
      <label class="manual-label" id="manualTaskLabel">Что не хочется делать</label>
      <select class="manual-select" id="manualTaskSelect"></select>
    </div>
    <div class="manual-field">
      <label class="manual-label">Когда не хочется</label>
      <input class="manual-date" type="date" id="manualDate">
    </div>
    <div class="manual-actions">
      <button class="manual-btn" onclick="closeManualPicker()">Отмена</button>
      <button class="manual-btn accent" onclick="createManualEvent()">Создать событие</button>
    </div>
  </div>
</div>

<!-- БЛОК СИСТЕМЫ -->
<div class="block-overlay" id="blockOverlay">
  <div class="block-card" id="blockCard"></div>
</div>

<script src="js/core.js"></script>
<script src="js/goals.js"></script>
<script src="js/routine.js"></script>
<script src="js/kanban.js"></script>
<script src="js/checklist.js"></script>
<script src="js/block.js"></script>
<script src="js/analysis.js"></script>
<script src="js/app.js"></script>
</body>
</html>
